<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>divider</title><defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#00AAAE" stop-opacity="0"/><stop offset=".5" stop-color="#00AAAE"/><stop offset="1" stop-color="#00AAAE" stop-opacity="0"/></linearGradient><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
text{font-family:'Vz','Vazirmatn',Tahoma,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.flt{animation:flt 7s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-16px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.dash{stroke-dasharray:4 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><path d="M 0 12 H 1200" stroke="url(#l)" stroke-width="2"/><rect x="594" y="6" width="12" height="12" transform="rotate(45 600 12)" fill="#00AAAE" class="pulse"/><circle r="3" cy="12" fill="#3DD9DC"><animateMotion dur="5s" repeatCount="indefinite" path="M 100 0 H 1100"/></circle></svg>